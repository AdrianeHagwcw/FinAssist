<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="945" viewBox="0 0 1600 1400" role="img" aria-labelledby="title description">
  <title id="title">FinAssist Complete Firestore NoSQL Model</title>
  <desc id="description">Firestore collections and their one-to-one, one-to-many, optional, nested, and array-based relationships.</desc>
  <defs>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; }
      .entity { fill: #fff; stroke: #123ee8; stroke-width: 2.5; }
      .head { fill: #0752e8; }
      .entity-name { fill: #fff; font-size: 18px; font-weight: 700; }
      .field { fill: #172033; font-size: 14px; }
      .path { fill: #4c5e79; font-size: 13px; font-family: Consolas, "Courier New", monospace; }
      .title { fill: #16294d; font-size: 29px; font-weight: 700; }
      .subtitle { fill: #50617c; font-size: 14px; }
      .section { fill: #344965; font-size: 16px; font-weight: 700; letter-spacing: .5px; }
      .relation { fill: #24334b; font-size: 14px; }
      .small { fill: #4c5c73; font-size: 12px; }
      .relation-box { fill: #f8faff; stroke: #cad5e4; stroke-width: 1.3; }
      .group { fill: #fbfcff; stroke: #c8d3e1; stroke-width: 1.6; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #596273; stroke-width: 1.7; }
    </style>
    <marker id="many" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10 6 L1 11 M1 6 L10 6" fill="none" stroke="#596273" stroke-width="1.5"/>
    </marker>
    <marker id="one" markerWidth="10" markerHeight="12" refX="5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M4 1 V11 M7 1 V11" fill="none" stroke="#596273" stroke-width="1.5"/>
    </marker>
    <marker id="optional-one" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r="2.3" fill="#fff" stroke="#596273" stroke-width="1.3"/>
      <path d="M8 1 V11" fill="none" stroke="#596273" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1600" height="1400" fill="#fff"/>
  <text class="title" x="48" y="48">FinAssist · Complete Firestore NoSQL Model</text>
  <text class="subtitle" x="50" y="75">Collections, nested documents, and logical relationship cardinalities from the current app code.</text>

  <!-- Authentication and profile are one-to-one via the Auth UID. -->
  <g>
    <rect class="entity" x="80" y="112" width="350" height="165" rx="14"/>
    <path class="head" d="M94 112 H416 Q430 112 430 126 V150 H80 V126 Q80 112 94 112 Z"/>
    <text class="entity-name" x="255" y="138" text-anchor="middle">Firebase Auth User</text>
    <text class="field" x="100" y="180">+ uid (authentication key)</text>
    <text class="field" x="100" y="205">+ email?, display identity</text>
    <text class="field" x="100" y="230">Password handled by Firebase Auth</text>
    <text class="path" x="100" y="255">Not stored in Cloud Firestore</text>
  </g>
  <path class="line" d="M430 184 H1170" marker-start="url(#one)" marker-end="url(#one)"/>
  <text class="small" x="746" y="174">uid · one-to-one</text>
  <g>
    <rect class="entity" x="1170" y="112" width="350" height="145" rx="14"/>
    <path class="head" d="M1184 112 H1506 Q1520 112 1520 126 V150 H1170 V126 Q1170 112 1184 112 Z"/>
    <text class="entity-name" x="1345" y="138" text-anchor="middle">UserProfile</text>
    <text class="field" x="1190" y="180">+ uid (document ID)</text>
    <text class="field" x="1190" y="205">+ name, email, setupCompleted</text>
    <text class="path" x="1190" y="235">users/{uid}</text>
  </g>

  <rect class="group" x="35" y="285" width="1530" height="515" rx="18"/>
  <text class="section" x="60" y="317">USER-OWNED COLLECTIONS · PROFILE SUBCOLLECTIONS PLUS NESTED GOAL CONTRIBUTIONS</text>

  <!-- User profile owns each of the following subcollections (1 to many). -->
  <path class="line" d="M1345 257 V333 H210 V365" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="line" d="M1345 333 H600 V365" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="line" d="M1345 333 H990 V365" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="line" d="M1345 333 H1380 V365" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="line" d="M1345 333 V585 H210 V610" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="line" d="M1345 585 H990 V610" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="line" d="M1145 460 H1225" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="line" d="M365 690 H445" marker-start="url(#one)" marker-end="url(#many)"/>

  <!-- Entity cards are drawn over collection ownership connectors. -->
  <g>
    <rect class="entity" x="55" y="365" width="310" height="190" rx="13"/>
    <path class="head" d="M68 365 H352 Q365 365 365 378 V402 H55 V378 Q55 365 68 365 Z"/>
    <text class="entity-name" x="210" y="390" text-anchor="middle">Wallet</text>
    <text class="path" x="73" y="426">wallets/{walletId}</text>
    <text class="field" x="73" y="451">+ name, type, purpose</text>
    <text class="field" x="73" y="475">+ balance, startingBalance</text>
    <text class="field" x="73" y="499">+ receivesIncome, archived, sortOrder</text>
    <text class="field" x="73" y="523">+ savingsKind?, maturityDate?</text>
  </g>
  <g>
    <rect class="entity" x="445" y="365" width="310" height="190" rx="13"/>
    <path class="head" d="M458 365 H742 Q755 365 755 378 V402 H445 V378 Q445 365 458 365 Z"/>
    <text class="entity-name" x="600" y="390" text-anchor="middle">Transaction</text>
    <text class="path" x="463" y="426">transactions/{transactionId}</text>
    <text class="field" x="463" y="451">+ type, amount, label, date</text>
    <text class="field" x="463" y="475">+ walletId?, toWalletId?</text>
    <text class="field" x="463" y="499">+ billInstanceId?, debtId?</text>
    <text class="field" x="463" y="523">+ note?, legacy, createdAt</text>
  </g>
  <g>
    <rect class="entity" x="835" y="365" width="310" height="190" rx="13"/>
    <path class="head" d="M848 365 H1132 Q1145 365 1145 378 V402 H835 V378 Q835 365 848 365 Z"/>
    <text class="entity-name" x="990" y="390" text-anchor="middle">Bill</text>
    <text class="path" x="853" y="426">bills/{billId}</text>
    <text class="field" x="853" y="451">+ name, amount, category</text>
    <text class="field" x="853" y="475">+ firstDueDate, recurrence, archived</text>
    <text class="field" x="853" y="499">+ walletId?, debtId?</text>
    <text class="field" x="853" y="523">+ endDate?, lastAmount?</text>
  </g>
  <g>
    <rect class="entity" x="1225" y="365" width="310" height="190" rx="13"/>
    <path class="head" d="M1238 365 H1522 Q1535 365 1535 378 V402 H1225 V378 Q1225 365 1238 365 Z"/>
    <text class="entity-name" x="1380" y="390" text-anchor="middle">BillInstance</text>
    <text class="path" x="1243" y="426">billInstances/{instanceId}</text>
    <text class="field" x="1243" y="451">+ billId, dueDate, status</text>
    <text class="field" x="1243" y="475">+ amount, amountPaid, carriedOver</text>
    <text class="field" x="1243" y="499">+ walletId?, paymentIds[]</text>
    <text class="field" x="1243" y="523">+ carriedInto?</text>
  </g>
  <text class="small" x="1160" y="449">billId</text>
  <g>
    <rect class="entity" x="835" y="610" width="310" height="160" rx="13"/>
    <path class="head" d="M848 610 H1132 Q1145 610 1145 623 V647 H835 V623 Q835 610 848 610 Z"/>
    <text class="entity-name" x="990" y="635" text-anchor="middle">Debt</text>
    <text class="path" x="853" y="671">debts/{debtId}</text>
    <text class="field" x="853" y="696">+ direction, name, category, status</text>
    <text class="field" x="853" y="720">+ principal, received?, payment terms</text>
    <text class="field" x="853" y="744">+ billId?, dueDate?, note?</text>
  </g>
  <g>
    <rect class="entity" x="55" y="610" width="310" height="160" rx="13"/>
    <path class="head" d="M68 610 H352 Q365 610 365 623 V647 H55 V623 Q55 610 68 610 Z"/>
    <text class="entity-name" x="210" y="635" text-anchor="middle">Goal</text>
    <text class="path" x="73" y="671">goals/{goalId}</text>
    <text class="field" x="73" y="696">+ name, targetAmount, savedAmount</text>
    <text class="field" x="73" y="720">+ status, kind, priority, targetDate?</text>
    <text class="field" x="73" y="744">+ walletId?, savedByWallet</text>
  </g>
  <g>
    <rect class="entity" x="1225" y="610" width="310" height="160" rx="13"/>
    <path class="head" d="M1238 610 H1522 Q1535 610 1535 623 V647 H1225 V623 Q1225 610 1238 610 Z"/>
    <text class="entity-name" x="1380" y="635" text-anchor="middle">AllocationCycle</text>
    <text class="path" x="1243" y="671">allocationCycles/{cycleId}</text>
    <text class="field" x="1243" y="696">+ income, receivedAt, remaining</text>
    <text class="field" x="1243" y="720">+ walletId?, goalId?, incomeTransactionId?</text>
    <text class="field" x="1243" y="744">+ billPayments[], skippedInstanceIds[]</text>
  </g>
  <g>
    <rect class="entity" x="445" y="610" width="310" height="160" rx="13"/>
    <path class="head" d="M458 610 H742 Q755 610 755 623 V647 H445 V623 Q445 610 458 610 Z"/>
    <text class="entity-name" x="600" y="635" text-anchor="middle">GoalContribution</text>
    <text class="path" x="463" y="671">goals/{goalId}/contributions/{id}</text>
    <text class="field" x="463" y="696">+ amount, date, walletId?</text>
    <text class="field" x="463" y="720">+ cycleId?, createdAt</text>
    <text class="field" x="463" y="744">Nested one-to-many under Goal</text>
  </g>
  <text class="small" x="375" y="681">goalId · 1:N</text>

  <text class="section" x="50" y="837">LOGICAL ID RELATIONSHIPS · CARDINALITY SHOWN FROM LEFT ENTITY TO RIGHT</text>
  <text class="small" x="50" y="858">These are document ID fields / arrays, not Firestore-enforced foreign keys. 0..1 means optional; 0..N means zero or many.</text>

  <rect class="relation-box" x="45" y="878" width="485" height="411" rx="13"/>
  <text class="section" x="65" y="908">WALLETS AND LEDGER</text>
  <text class="relation" x="65" y="938">Wallet 1  →  0..N Transactions (walletId)</text>
  <text class="relation" x="65" y="965">Wallet 1  →  0..N Transactions (toWalletId)</text>
  <text class="relation" x="65" y="992">Wallet 1  →  0..N Bills (bill.walletId)</text>
  <text class="relation" x="65" y="1019">Wallet 1  →  0..N BillInstances (walletId)</text>
  <text class="relation" x="65" y="1046">Wallet 1  →  0..N Goals (goal.walletId)</text>
  <text class="relation" x="65" y="1073">Wallet 1  →  0..N GoalContributions (walletId)</text>
  <text class="relation" x="65" y="1100">Wallet 1  →  0..N AllocationCycles (walletId)</text>
  <text class="relation" x="65" y="1140">Debt 1  →  0..N Transactions (transaction.debtId)</text>
  <text class="relation" x="65" y="1167">BillInstance 1  →  0..N Transactions (billInstanceId)</text>
  <text class="small" x="65" y="1210">A transfer may reference a source wallet and</text>
  <text class="small" x="65" y="1230">destination wallet on the same transaction.</text>

  <rect class="relation-box" x="558" y="878" width="485" height="411" rx="13"/>
  <text class="section" x="578" y="908">PLANS, GOALS AND CYCLES</text>
  <text class="relation" x="578" y="938">Bill 1  →  0..N BillInstances (billId)</text>
  <text class="relation" x="578" y="965">Debt 0..1  ↔  0..1 Bill (billId / debtId)</text>
  <text class="relation" x="578" y="992">Goal 1  →  0..N GoalContributions (nested)</text>
  <text class="relation" x="578" y="1019">Goal 1  →  0..N AllocationCycles (goalId)</text>
  <text class="relation" x="578" y="1046">AllocationCycle 0..1  →  0..1 Transaction</text>
  <text class="small" x="598" y="1067">(incomeTransactionId)</text>
  <text class="relation" x="578" y="1094">AllocationCycle 1  →  0..N Contributions</text>
  <text class="small" x="598" y="1115">(contribution.cycleId)</text>
  <text class="relation" x="578" y="1142">AllocationCycle 1  →  0..N BillInstances</text>
  <text class="small" x="598" y="1163">(billPayments[] / skippedInstanceIds[])</text>
  <text class="small" x="578" y="1195">billPayments[] embeds billId, instanceId and</text>
  <text class="small" x="578" y="1215">transactionId; array references may become stale.</text>

  <rect class="relation-box" x="1070" y="878" width="485" height="411" rx="13"/>
  <text class="section" x="1090" y="908">IDENTITY AND MIGRATION</text>
  <text class="relation" x="1090" y="938">Firebase Auth User 1  ↔  1 UserProfile</text>
  <text class="small" x="1110" y="959">(Auth uid = users/{uid})</text>
  <text class="relation" x="1090" y="990">UserProfile 1  →  0..N documents in each</text>
  <text class="small" x="1110" y="1011">profile collection above, plus expenses/ and</text>
  <text class="small" x="1110" y="1031">dailyIncomeTransactions/ legacy sources.</text>
  <text class="relation" x="1090" y="1062">Legacy expense 1  →  0..1 Transaction copy</text>
  <text class="relation" x="1090" y="1089">Legacy income 1  →  0..1 Transaction copy</text>
  <text class="small" x="1110" y="1110">(same document ID; imported copy has legacy=true)</text>
  <text class="small" x="1090" y="1160">Original legacy documents remain after import.</text>
  <text class="small" x="1090" y="1200">Cardinality describes app data, not DB constraints.</text>

  <text class="subtitle" x="50" y="1328">Notation: 1 = exactly one · 0..1 = optional one · 0..N = zero or many · [] = array of references · ↔ indicates an optional relationship at either end.</text>
  <text class="subtitle" x="50" y="1356">Firestore does not enforce foreign keys; reference cardinalities reflect current FinAssist service behavior.</text>
</svg>
