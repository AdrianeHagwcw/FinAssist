<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2450" viewBox="0 0 1100 2450" role="img" aria-labelledby="title description">
  <title id="title">NoSQL ERD</title>
  <desc id="description">Portrait Firestore ERD with two entities per row and nested collections shown beside their parents.</desc>
  <defs>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; }
      .title { fill: #16294d; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #50617c; font-size: 15px; }
      .section { fill: #344965; font-size: 17px; font-weight: 700; letter-spacing: .4px; }
      .entity { fill: #fff; stroke: #123ee8; stroke-width: 2; }
      .head { fill: #0752e8; }
      .entity-name { fill: #fff; font-size: 18px; font-weight: 700; }
      .path { fill: #4c5e79; font: 12px Consolas, "Courier New", monospace; }
      .field { fill: #172033; font-size: 13px; }
      .small { fill: #4c5c73; font-size: 13px; }
      .line { fill: none; stroke: #596273; stroke-width: 1.7; }
      .group { fill: #fbfcff; stroke: #c8d3e1; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .relation-box { fill: #f8faff; stroke: #cad5e4; stroke-width: 1.3; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#596273" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1100" height="2450" fill="#fff"/>
  <text class="title" x="55" y="55">NoSQL ERD</text>
  <text class="subtitle" x="55" y="82">Firestore collections and nested documents · top-to-bottom view</text>

  <!-- Authentication account and profile document. -->
  <g>
    <rect class="entity" x="55" y="110" width="990" height="105" rx="12"/>
    <path class="head" d="M67 110 H1033 Q1045 110 1045 122 V143 H55 V122 Q55 110 67 110 Z"/>
    <text class="entity-name" x="550" y="134" text-anchor="middle">Account</text>
    <text class="field" x="80" y="169">uid · email · display identity</text>
    <text class="path" x="80" y="194">Firebase Authentication · password is not stored in Firestore</text>
  </g>
  <path class="line" d="M550 215 V245" marker-end="url(#arrow)"/>
  <text class="small" x="565" y="237">1:1 · same uid</text>
  <g>
    <rect class="entity" x="55" y="245" width="990" height="145" rx="12"/>
    <path class="head" d="M67 245 H1033 Q1045 245 1045 257 V280 H55 V257 Q55 245 67 245 Z"/>
    <text class="entity-name" x="550" y="271" text-anchor="middle">User</text>
    <text class="path" x="80" y="306">users/{uid}</text>
    <text class="field" x="80" y="332">email · name · setupCompleted · onboardingVersion · createdAt · updatedAt</text>
    <text class="field" x="80" y="358">notificationsEnabled · reminders{} · priorities[] · plannedAllocations{}</text>
    <text class="field" x="80" y="382">customCategories[] · hiddenCategories[] · legacy import metadata</text>
  </g>

  <rect class="group" x="35" y="420" width="1030" height="960" rx="16"/>
  <text class="section" x="60" y="453">USER COLLECTIONS · TWO ENTITIES PER ROW</text>

  <!-- Row 1 -->
  <g>
    <rect class="entity" x="55" y="475" width="480" height="155" rx="11"/>
    <path class="head" d="M66 475 H524 Q535 475 535 486 V509 H55 V486 Q55 475 66 475 Z"/>
    <text class="entity-name" x="295" y="500" text-anchor="middle">Wallet</text>
    <text class="path" x="75" y="534">users/{uid}/wallets/{walletId}</text>
    <text class="field" x="75" y="562">name · type · purpose · balance</text>
    <text class="field" x="75" y="586">startingBalance · receivesIncome · archived</text>
    <text class="field" x="75" y="610">sortOrder · savings/interest fields?</text>
  </g>
  <g>
    <rect class="entity" x="565" y="475" width="480" height="155" rx="11"/>
    <path class="head" d="M576 475 H1034 Q1045 475 1045 486 V509 H565 V486 Q565 475 576 475 Z"/>
    <text class="entity-name" x="805" y="500" text-anchor="middle">Transaction</text>
    <text class="path" x="585" y="534">users/{uid}/transactions/{transactionId}</text>
    <text class="field" x="585" y="562">type · amount · label · date · note?</text>
    <text class="field" x="585" y="586">walletId? · toWalletId? · billInstanceId?</text>
    <text class="field" x="585" y="610">debtId? · legacy · interest · installmentPayment</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect class="entity" x="55" y="650" width="480" height="155" rx="11"/>
    <path class="head" d="M66 650 H524 Q535 650 535 661 V684 H55 V661 Q55 650 66 650 Z"/>
    <text class="entity-name" x="295" y="675" text-anchor="middle">Bill</text>
    <text class="path" x="75" y="709">users/{uid}/bills/{billId}</text>
    <text class="field" x="75" y="737">name · amount · category · recurrence</text>
    <text class="field" x="75" y="761">firstDueDate · archived · walletId?</text>
    <text class="field" x="75" y="785">debtId? · startDate? · endDate? · lastAmount?</text>
  </g>
  <g>
    <rect class="entity" x="565" y="650" width="480" height="155" rx="11"/>
    <path class="head" d="M576 650 H1034 Q1045 650 1045 661 V684 H565 V661 Q565 650 576 650 Z"/>
    <text class="entity-name" x="805" y="675" text-anchor="middle">Bill Occurrence</text>
    <text class="path" x="585" y="709">users/{uid}/billInstances/{instanceId}</text>
    <text class="field" x="585" y="737">billId · dueDate · status · amount · amountPaid</text>
    <text class="field" x="585" y="761">carriedOver · paymentIds[] · walletId?</text>
    <text class="field" x="585" y="785">carriedInto? · debtId? · interestShare?</text>
  </g>

  <!-- Row 3: parent debt and its nested collection. -->
  <g>
    <rect class="entity" x="55" y="825" width="480" height="155" rx="11"/>
    <path class="head" d="M66 825 H524 Q535 825 535 836 V859 H55 V836 Q55 825 66 825 Z"/>
    <text class="entity-name" x="295" y="850" text-anchor="middle">Debt</text>
    <text class="path" x="75" y="884">users/{uid}/debts/{debtId}</text>
    <text class="field" x="75" y="912">direction · name · category · status</text>
    <text class="field" x="75" y="936">principal · received? · payment terms</text>
    <text class="field" x="75" y="960">billId? · dueDate? · note?</text>
  </g>
  <g>
    <rect class="entity" x="565" y="825" width="480" height="155" rx="11"/>
    <path class="head" d="M576 825 H1034 Q1045 825 1045 836 V859 H565 V836 Q565 825 576 825 Z"/>
    <text class="entity-name" x="805" y="850" text-anchor="middle">Interest Charge</text>
    <text class="path" x="585" y="884">users/{uid}/debts/{debtId}/interestCharges/{periodKey}</text>
    <text class="field" x="585" y="912">Nested under one Debt</text>
    <text class="field" x="585" y="936">One debt has zero or many charges</text>
    <text class="field" x="585" y="960">Per-period interest record</text>
  </g>

  <!-- Row 4: parent goal and nested contributions. -->
  <g>
    <rect class="entity" x="55" y="1000" width="480" height="155" rx="11"/>
    <path class="head" d="M66 1000 H524 Q535 1000 535 1011 V1034 H55 V1011 Q55 1000 66 1000 Z"/>
    <text class="entity-name" x="295" y="1025" text-anchor="middle">Goal</text>
    <text class="path" x="75" y="1059">users/{uid}/goals/{goalId}</text>
    <text class="field" x="75" y="1087">name · targetAmount · savedAmount · status</text>
    <text class="field" x="75" y="1111">kind · priority · targetDate? · walletId?</text>
    <text class="field" x="75" y="1135">savedByWallet{} · funding/planning fields</text>
  </g>
  <g>
    <rect class="entity" x="565" y="1000" width="480" height="155" rx="11"/>
    <path class="head" d="M576 1000 H1034 Q1045 1000 1045 1011 V1034 H565 V1011 Q565 1000 576 1000 Z"/>
    <text class="entity-name" x="805" y="1025" text-anchor="middle">Goal Contribution</text>
    <text class="path" x="585" y="1059">users/{uid}/goals/{goalId}/contributions/{contributionId}</text>
    <text class="field" x="585" y="1087">Nested under one Goal</text>
    <text class="field" x="585" y="1111">amount · date · walletId? · cycleId?</text>
    <text class="field" x="585" y="1135">One goal has zero or many contributions</text>
  </g>

  <!-- Row 5 -->
  <g>
    <rect class="entity" x="55" y="1175" width="480" height="155" rx="11"/>
    <path class="head" d="M66 1175 H524 Q535 1175 535 1186 V1209 H55 V1186 Q55 1175 66 1175 Z"/>
    <text class="entity-name" x="295" y="1200" text-anchor="middle">Allocation</text>
    <text class="path" x="75" y="1234">users/{uid}/allocationCycles/{cycleId}</text>
    <text class="field" x="75" y="1262">income · receivedAt · remaining · walletId?</text>
    <text class="field" x="75" y="1286">goalId? · incomeTransactionId?</text>
    <text class="field" x="75" y="1310">billPayments[] · skippedInstanceIds[]</text>
  </g>
  <g>
    <rect class="entity" x="565" y="1175" width="480" height="155" rx="11"/>
    <path class="head" d="M576 1175 H1034 Q1045 1175 1045 1186 V1209 H565 V1186 Q565 1175 576 1175 Z"/>
    <text class="entity-name" x="805" y="1200" text-anchor="middle">Legacy Records</text>
    <text class="path" x="585" y="1234">users/{uid}/expenses/{expenseId}</text>
    <text class="path" x="585" y="1258">users/{uid}/dailyIncomeTransactions/{incomeId}</text>
    <text class="field" x="585" y="1286">Copied into transactions with same ID,</text>
    <text class="field" x="585" y="1310">marked legacy: true; originals remain.</text>
  </g>
  <text class="small" x="65" y="1360">categoryBudgets appears in legacy account cleanup only.</text>

  <text class="section" x="55" y="1415">SHARED COLLECTIONS</text>
  <g>
    <rect class="entity" x="55" y="1440" width="480" height="155" rx="11"/>
    <path class="head" d="M66 1440 H524 Q535 1440 535 1451 V1474 H55 V1451 Q55 1440 66 1440 Z"/>
    <text class="entity-name" x="295" y="1465" text-anchor="middle">Price References</text>
    <text class="path" x="75" y="1499">priceReferences/{referenceId}</text>
    <text class="field" x="75" y="1527">Scraped reference data · updatedAt</text>
    <text class="field" x="75" y="1551">status includes last check time/results</text>
    <text class="field" x="75" y="1575">Signed-in users read; app writes disabled</text>
  </g>
  <g>
    <rect class="entity" x="565" y="1440" width="480" height="155" rx="11"/>
    <path class="head" d="M576 1440 H1034 Q1045 1440 1045 1451 V1474 H565 V1451 Q565 1440 576 1440 Z"/>
    <text class="entity-name" x="805" y="1465" text-anchor="middle">Scraper Run</text>
    <text class="path" x="585" y="1499">scraperRuns/{runId}</text>
    <text class="field" x="585" y="1527">startedAt · finishedAt · results</text>
    <text class="field" x="585" y="1551">Backend run log</text>
    <text class="field" x="585" y="1575">Not accessible to the app</text>
  </g>

  <rect class="relation-box" x="55" y="1635" width="990" height="690" rx="14"/>
  <text class="section" x="80" y="1672">LOGICAL RELATIONSHIPS</text>
  <text class="field" x="80" y="1710">Account 1 ↔ 1 User · the Firebase Auth uid identifies users/{uid}</text>
  <text class="field" x="80" y="1744">User 1 → many Wallets, Transactions, Bills, Bill Occurrences, Debts, Goals, Allocations</text>
  <text class="field" x="80" y="1778">Bill 1 → many Bill Occurrences · Debt 1 → many Interest Charges</text>
  <text class="field" x="80" y="1812">Goal 1 → many Goal Contributions</text>
  <text class="field" x="80" y="1846">Wallet 1 → many Transactions, Bills, Bill Occurrences, Goals, Contributions, Allocations</text>
  <text class="field" x="80" y="1880">Debt 0..1 ↔ 0..1 Bill · Transaction may reference a Debt or Bill Occurrence</text>
  <text class="field" x="80" y="1914">Allocation may reference a Goal and income Transaction; bill payments are embedded</text>
  <text class="field" x="80" y="1948">Legacy record 0..1 → Transaction copy (same document ID)</text>
  <text class="small" x="80" y="2000">ID fields and arrays are logical references. Firestore does not enforce foreign keys.</text>
  <text class="small" x="80" y="2030">Optional fields use ? · arrays/maps use [] / {}</text>
  <text class="small" x="80" y="2078">Reminder, priority, allocation-plan, and category preferences are fields on users/{uid}.</text>
  <text class="small" x="80" y="2108">Theme and amount-display preferences are stored on the device, not in Firestore.</text>
</svg>
