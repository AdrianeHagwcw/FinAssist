# The price scraper (backend/scraper/README.md).
#
# - Every day at about 12:17 PM Philippine time it collects the prices and
#   saves them in Firestore. Noon, so a new inflation rate the PSA released
#   that morning is picked up the same day. It can also be started by
#   hand: Actions tab -> Price scraper -> Run workflow.
# - On every push that changes the scraper, only its tests run.
#
# Saving needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key
# of a Firebase service account (Firebase console -> Project settings ->
# Service accounts -> Generate new private key).

name: Price scraper

on:
  schedule:
    # 04:17 UTC daily. Not on the hour, when GitHub is busiest and
    # scheduled runs start late.
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'backend/scraper/**'
      - '.github/workflows/price-scraper.yml'

permissions:
  contents: read

# A run started by hand while the daily one is going waits its turn.
concurrency:
  group: price-scraper
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend/scraper

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  scrape:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/scraper/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Collect, check, analyze and save the prices
        run: python -m price_scraper.main
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
